# CI de Atlas Financials: valida y, en main, despliega al VPS de IONOS
# (financials.atlasone.com.mx).
#
# Hay dos tareas de deploy y sólo corre una:
#   * "Deploy a IONOS" (la buena): DESPLIEGUE_SEGURO=true. Entra como el usuario `deploy`, sin root, con una llave
#     que en el servidor sólo puede ejecutar entrada.sh; manda el SHA y nada más. Secreto IONOS_DEPLOY_KEY.
#   * "Deploy a IONOS (root, se retira)": la anterior, con la llave de root (IONOS_SSH_KEY). Sigue viva sólo hasta
#     que el servidor tenga instalado deploy/ionos/ (ver deploy/ionos/README.md); después se borra junto con la
#     llave de root.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token de cada corrida sólo lee el repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financials
          POSTGRES_PASSWORD: financials
          POSTGRES_DB: financials_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financials"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://financials:financials@localhost:5432/financials_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # La imagen que corre en producción: se construye, se migra contra un PostgreSQL de la misma versión que el del
  # servidor y se arranca como en producción (sólo lectura, sin capacidades) hasta que ve la base.
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir
        run: docker build -t financials:ci .
      - name: PostgreSQL 18
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=financials -e POSTGRES_PASSWORD=financials \
            -e POSTGRES_DB=financials postgres:18-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U financials >/dev/null 2>&1 && break; sleep 2; done
      - name: Migrar (como deploy.sh, antes de arrancar)
        run: |
          docker run --rm --network ci -e ENV=production -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgresql://financials:financials@pg:5432/financials financials:ci alembic upgrade head
      - name: Arrancar endurecida y esperar a que vea la base
        run: |
          docker run -d --name financials --network ci -p 8000:8000 \
            --read-only --tmpfs /tmp:size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 1g \
            -e ENV=production -e SECRET_KEY="$(openssl rand -hex 32)" -e MIGRAR_AL_ARRANCAR=0 \
            -e DATABASE_URL=postgresql://financials:financials@pg:5432/financials financials:ci
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health/deep)" = 200 ] && break
            sleep 3
          done
          curl -fsS http://localhost:8000/api/health/deep | grep -q '"database":"ok"' \
            || { docker logs --tail 80 financials; exit 1; }
      - name: La SPA responde y no sirve archivos de fuera
        run: |
          curl -fsS http://localhost:8000/ | grep -qi '<div id="root"' || { echo "la SPA no respondió"; exit 1; }
          if curl -s --path-as-is 'http://localhost:8000/..%2f..%2f..%2fetc%2fpasswd' | grep -q '^root:'; then
            echo "el catch-all sirvió /etc/passwd"; exit 1
          fi

  deploy:
    name: Deploy a IONOS
    runs-on: ubuntu-latest
    needs: [backend, frontend, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_SEGURO == 'true'
    timeout-minutes: 25
    concurrency:
      group: deploy-ionos-financials
      cancel-in-progress: false
    steps:
      - name: Mandar el SHA al servidor
        env:
          LLAVE: ${{ secrets.IONOS_DEPLOY_KEY }}
          HOSTS_CONOCIDOS: ${{ secrets.IONOS_KNOWN_HOSTS }}
          HOST: ${{ secrets.IONOS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$LLAVE" || { echo "Falta el secreto IONOS_DEPLOY_KEY"; exit 1; }
          test -n "$HOSTS_CONOCIDOS" || { echo "Falta el secreto IONOS_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Huella fijada, nunca ssh-keyscan en caliente.
          printf '%s\n' "$HOSTS_CONOCIDOS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          # La llave sólo puede ejecutar entrada.sh: el servidor construye, migra, cambia el contenedor, espera a
          # que esté sano y, si no lo logra, vuelve a la imagen anterior. Su código de salida es el de este paso.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "deploy@$HOST" "$SHA"
      - name: Verificar desde fuera
        run: |
          for i in $(seq 1 12); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' https://financials.atlasone.com.mx/api/health/deep)" = 200 ] && exit 0
            sleep 5
          done
          echo "financials.atlasone.com.mx no respondió sana"; exit 1

  deploy-root:
    name: Deploy a IONOS (root, se retira)
    runs-on: ubuntu-latest
    # Solo al aterrizar en main, y solo si backend y frontend pasaron.
    needs: [backend, frontend, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_IONOS == 'true' && vars.DESPLIEGUE_SEGURO != 'true'
    timeout-minutes: 25
    # Un despliegue a la vez; el segundo espera en vez de cancelar al primero.
    concurrency:
      group: deploy-ionos-financials
      cancel-in-progress: false
    env:
      RUTA: /srv/apps/financials
    steps:
      - uses: actions/checkout@v4

      - name: Configurar el acceso SSH
        env:
          LLAVE: ${{ secrets.IONOS_SSH_KEY }}
          HOSTS_CONOCIDOS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          test -n "$LLAVE" || { echo "Falta el secreto IONOS_SSH_KEY"; exit 1; }
          test -n "$HOSTS_CONOCIDOS" || { echo "Falta el secreto IONOS_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Huella fijada, nunca ssh-keyscan en caliente.
          printf '%s\n' "$HOSTS_CONOCIDOS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Enviar el código al servidor
        env:
          DESTINO: root@${{ secrets.IONOS_HOST }}
        run: |
          # El commit viaja dentro de la imagen para verificar después qué corre.
          echo "${{ github.sha }}" > .commit_desplegado
          # Se vacía src/ antes de extraer: un archivo borrado en main no debe
          # sobrevivir en el servidor. La app no guarda nada en disco.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" "set -e; mkdir -p $RUTA/src; find $RUTA/src -mindepth 1 -delete"
          tar --exclude=.git --exclude=node_modules -cf - . \
            | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" "tar -x -C $RUTA/src"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" "cp $RUTA/src/deploy/ionos/docker-compose.yml $RUTA/docker-compose.yml"

      - name: Construir y levantar
        env:
          DESTINO: root@${{ secrets.IONOS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" "cd $RUTA && docker compose build && docker compose up -d"

      - name: Verificar que el contenedor corre el commit nuevo
        env:
          DESTINO: root@${{ secrets.IONOS_HOST }}
        run: |
          for i in $(seq 1 30); do
            DESPLEGADO=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" \
              'docker exec financials cat /app/.commit_desplegado 2>/dev/null' || true)
            [ "$DESPLEGADO" = "${{ github.sha }}" ] && break
            sleep 5
          done
          if [ "$DESPLEGADO" != "${{ github.sha }}" ]; then
            echo "El contenedor NO corre ${{ github.sha }} (dice: '${DESPLEGADO:-nada}')"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DESTINO" 'docker logs --tail 60 financials' || true
            exit 1
          fi

      - name: Verificar que la API responde
        run: |
          for i in $(seq 1 36); do
            # /health/deep responde 200 aunque la base falle: se revisa el cuerpo.
            CUERPO=$(curl -s https://financials.atlasone.com.mx/api/health/deep || true)
            echo "$CUERPO" | grep -q '"database":"ok"' && break
            sleep 5
          done
          echo "$CUERPO" | grep -q '"database":"ok"' || { echo "La API no respondió sana (último: ${CUERPO:-nada})"; exit 1; }
